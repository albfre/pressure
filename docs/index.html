<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pressure optimizer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="pressure_optimization_wasm.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Pressure optimizer</h1>

    <div class="input-section">
        <div class="tubes-container">
            <div class="tube-column">
                <h3>Donor tubes</h3>
                <table id="donorInputs" class="tube-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Vol.</th>
                            <th>Pres.</th>
                            <th>Fin. pres.</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button onclick="addTube('donor', 12, 232)">Add donor</button>
            </div>
            <div class="tube-column">
                <h3>Target tubes</h3>
                <table id="targetInputs" class="tube-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Vol.</th>
                            <th>Pres.</th>
                            <th>Max pres.</th>
                            <th>Fin. pres.</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button onclick="addTube('target', 10, 100, 200)">Add target</button>
            </div>
        </div>

        <div class="solver-params">
            <h3>Max no. of connections: <input type="number" id="depthLeft" min="1" max="12" value="8"></h3>
        </div>
        <button onclick="solveProblem()">Solve</button>

    </div>

    <div id="results" class="hidden">
        <div id="events">
            <div class="tube-column">
                <h3>Connections to make</h3>
                <table id="connectionsToMake" class="tube-table">
                    <thead>
                        <tr>
                            <th>Connection</th>
                            <th>D before</th>
                            <th>D after</th>
                            <th>T before</th>
                            <th>T after</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
